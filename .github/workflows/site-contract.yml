name: Site contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  headers:
    name: Site headers contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Verify scoped security headers
        run: python3 scripts/test-site-headers-contract.py
