name: Site contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  headers:
    name: Site headers contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Verify scoped security headers
        run: python3 scripts/test-site-headers-contract.py

      - name: Verify site contract workflow wiring
        run: python3 scripts/test-site-contract-workflow.py

  installer_provenance:
    name: Installer provenance contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Verify offline installer provenance contract
        run: bash scripts/test-installer-provenance-contract.sh

      - name: Verify committed installer against its immutable source pin
        run: bash scripts/check-installer-provenance.sh
